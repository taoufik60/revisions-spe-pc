<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions Spé PC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap');

/* ===== THÈMES ===== */
:root, [data-theme="ocean"]{
  --grad-haut:#0A2E6E; --grad-bas:#1B4FA8;
  --primaire:#1B4FA8; --primaire2:#2E6BD4; --primaireC:#E5EDFA;
  --accent:#13A89E; --accent2:#16C4B8; --accentC:#DEF5F3;
  --txt-primaire:#0A2E6E;
}
[data-theme="emeraude"]{
  --grad-haut:#0B4D3C; --grad-bas:#0F6E56;
  --primaire:#0F6E56; --primaire2:#1D9E75; --primaireC:#E1F5EE;
  --accent:#C77D2E; --accent2:#E8A04E; --accentC:#FAEEDA;
  --txt-primaire:#0B4D3C;
}
[data-theme="violet"]{
  --grad-haut:#2D2160; --grad-bas:#4A3A9E;
  --primaire:#4A3A9E; --primaire2:#6B54C7; --primaireC:#ECE8FA;
  --accent:#C44D8A; --accent2:#E06BA8; --accentC:#FAE5F0;
  --txt-primaire:#2D2160;
}

:root{
  --papier:#F4F6FA;--blanc:#fff;--ligne:#E5E7EC;--encre:#1A2230;
  --coral:#C0392B;--coralC:#FDEBE8;--coral2:#E2574C;
  --amber:#9A6206;--amberC:#FCEFD4;--amber2:#EFA42A;
  --green:#2E7D32;--greenC:#E6F4E7;--green2:#52A45A;
  --ok:#2E8B57;--okC:#E4F3EA;--err:#C0392B;--errC:#FAE8E5;
  --gris:#7C8597;
}
*{box-sizing:border-box;font-family:'Public Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:var(--papier);color:var(--encre)}
.display{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:76px}
button{cursor:pointer;border:none;font-size:16px;font-family:inherit}
.scroll{flex:1;overflow-y:auto}

/* En-tête dégradé */
.hero{background:linear-gradient(160deg,var(--grad-haut),var(--grad-bas));padding:28px 20px 56px;color:#fff;position:relative;overflow:hidden}
.hero-deco{position:absolute;top:-20px;right:-20px;width:180px;height:180px;opacity:.13;pointer-events:none}
.hero h1{font-size:34px;line-height:1;margin:0}
.hero .sub{font-size:14px;opacity:.85;margin-top:6px}
.avatar{position:absolute;top:24px;right:20px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);cursor:pointer}

/* Sélecteur chapitre */
.chap-select{margin:-38px 16px 0;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;padding:14px 18px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative;z-index:5;cursor:pointer}
.chap-select .ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.chap-select .lab{font-size:13px;opacity:.85}
.chap-select .val{font-size:17px;font-weight:700}

/* Cartes espaces */
.zone{margin:14px 16px;background:var(--blanc);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(20,30,50,.05)}
.zone-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.zone-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.zone-titre{font-size:19px;font-weight:800;color:var(--txt-primaire);letter-spacing:-.01em}
.zone-sub{font-size:13px;color:var(--gris);margin:2px 0 16px;padding-left:52px}
.btn{display:flex;width:100%;min-height:54px;border-radius:14px;font-weight:700;align-items:center;justify-content:center;gap:10px;transition:transform .1s;font-size:16px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn-plein{background:linear-gradient(135deg,var(--primaire),var(--primaire2));color:#fff;box-shadow:0 4px 14px rgba(27,79,168,.25)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-ligne{background:var(--blanc);border:1.5px solid var(--primaireC);color:var(--primaire);margin-top:10px}
.btn-encre{background:var(--encre);color:#fff}
.btn-blanc{background:var(--blanc);border:1px solid var(--ligne);color:var(--encre)}

/* Préparer bac */
.bac-row{margin:14px 16px;background:var(--blanc);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(20,30,50,.05);cursor:pointer}
.bac-ic{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}

/* Progression résumé */
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog-row:last-child{margin-bottom:0}
.prog-lab{font-size:14px;font-weight:600;width:80px;flex-shrink:0}
.prog-bar{flex:1;height:9px;border-radius:99px;background:var(--ligne);overflow:hidden}
.prog-bar>div{height:100%;border-radius:99px}
.prog-pct{font-size:15px;font-weight:700;width:44px;text-align:right}
.dot{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.dot b{font-size:15px}

/* Nav bas */
.navbas{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--blanc);border-top:1px solid var(--ligne);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
.navbas button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gris);font-size:11px;font-weight:600}
.navbas button.actif{color:var(--primaire)}
.navbas button svg{width:22px;height:22px}

/* Composants séance */
.ecran-pad{padding:20px}
input,select{min-height:52px;border-radius:14px;border:1px solid var(--ligne);background:var(--blanc);color:var(--encre);padding:0 16px;font-size:16px;outline:none;font-family:inherit}
.option{display:block;width:100%;text-align:left;background:var(--blanc);border:1px solid var(--ligne);border-radius:14px;padding:14px 16px;min-height:52px;font-size:15px;color:var(--encre);margin-top:10px;transition:transform .1s}
.option:active{transform:scale(.98)}
.option.bonne{background:var(--okC);border-color:var(--ok)}
.option.fausse{background:var(--errC);border-color:var(--err)}
.option:disabled{cursor:default}
.progress{height:7px;border-radius:99px;background:var(--ligne);overflow:hidden;flex:1}
.progress>div{height:100%;border-radius:99px;background:var(--primaire);transition:width .4s}
.home-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--ligne);background:var(--blanc);color:var(--encre);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flip-carte{flex:1;min-height:240px;border-radius:18px;border:1px solid var(--ligne);background:var(--blanc);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flip-carte.verso{background:var(--encre);color:#fff;border-color:var(--encre)}
.sticky-bas{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--papier) 30%);margin-top:auto}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--ligne);border-top-color:var(--primaire);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pilule{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--primaireC);color:var(--primaire)}
.niveau-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.nv0{background:#EFF1F5;color:var(--gris)}.nv1{background:var(--coralC);color:var(--coral)}
.nv2{background:var(--amberC);color:var(--amber)}.nv3{background:var(--greenC);color:var(--green)}
.modal-fond{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--papier);width:100%;max-width:440px;border-radius:24px 24px 0 0;max-height:85vh;overflow-y:auto;padding:20px}
.check-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--blanc);border:1px solid var(--ligne);border-radius:12px;margin-bottom:8px;cursor:pointer}
.check-row.coche{border-color:var(--primaire);background:var(--primaireC)}
.check-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ligne);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-row.coche .check-box{background:var(--primaire);border-color:var(--primaire);color:#fff}
.err-txt{color:var(--err);font-size:14px}.muted{color:var(--gris)}.petit{font-size:13px}.centre{text-align:center}
</style>
</head>
<body>
<div class="app" id="app"><div class="centre" style="padding-top:40vh"><span class="spin"></span></div></div>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const APP = document.getElementById('app');
const esc = s => (s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const htmlC = s => (s??'').replace(/<(?!\/?(strong|em|b|i|br|sub|sup)\b)[^>]*>/gi,'');
const melange = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const maths = el => {if(window.renderMathInElement)try{renderMathInElement(el||APP,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}catch(e){}};
const today = ()=>new Date().toISOString().slice(0,10);

const ICN={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 5-5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
};
const NIVEAUX={0:{l:'Nouveau',c:'nv0'},1:{l:'Niveau 1',c:'nv1'},2:{l:'Niveau 2',c:'nv2'},3:{l:'Expert ⭐',c:'nv3'}};
const badge=n=>`<span class="niveau-badge ${NIVEAUX[n].c}">${NIVEAUX[n].l}</span>`;

let S={eleve:null,classe:null,chapitres:[],chapActifs:[],srs:{},notions:[],progression:{},
  chapCourant:null,theme:'ocean',ongletActif:'accueil',
  fileQcm:[],fileCartes:[],resQcm:[],resCartes:[],ankiFile:[],ankiIdx:0,ankiRepasse:[],
  mode:'',bacChaps:[]};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  (await charger())?accueil():login('Compte introuvable.');
}

async function charger(){
  const {data:el}=await sb.from('eleves').select('*').eq('user_id',(await sb.auth.getUser()).data.user.id).maybeSingle();
  if(!el){await sb.auth.signOut();return false;}
  S.eleve=el; S.theme=el.theme||'ocean';
  document.documentElement.setAttribute('data-theme',S.theme);
  const [{data:cl},{data:cc},{data:srs},{data:nts},{data:prog}]=await Promise.all([
    sb.from('classes').select('*').eq('id',el.classe_id).maybeSingle(),
    sb.from('classe_chapitres').select('*').eq('classe_id',el.classe_id).eq('active',true),
    sb.from('srs_notions').select('*'),
    sb.from('notions').select('*'),
    sb.from('progression').select('*').eq('eleve_id',el.id)
  ]);
  S.classe=cl||{session_size_qcm:15,session_size_cards:10,nom:''};
  S.chapActifs=(cc||[]).map(c=>c.chapter_id).sort((a,b)=>a-b);
  S.srs={};(srs||[]).forEach(r=>S.srs[r.notion_id]=r);
  S.notions=(nts||[]).filter(n=>S.chapActifs.includes(n.chapter_id));
  S.progression={};(prog||[]).forEach(p=>S.progression[p.chapter_id]=p);
  const {data:chs}=await sb.from('v_items_eleve').select('chapter_id,chapter_title').in('chapter_id',S.chapActifs.length?S.chapActifs:[-1]).limit(2000);
  const seen={};(chs||[]).forEach(r=>seen[r.chapter_id]=r.chapter_title);
  S.chapitres=Object.entries(seen).map(([id,nom])=>({id:+id,nom})).sort((a,b)=>a.id-b.id);
  const dernier = el.dernier_chapitre;
  S.chapCourant = (dernier !== null && dernier !== undefined && S.chapActifs.includes(dernier))
    ? dernier : (S.chapActifs[0] ?? null);
  return true;
}

// ═══════════ LOGIN ═══════════
function login(msg){
  APP.innerHTML=`<div class="ecran-pad" style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh">
    <div style="width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--grad-haut),var(--grad-bas));display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:28px">⚗️</div>
    <h1 class="display" style="font-size:28px">Révisions Spé PC</h1>
    <p class="muted petit" style="margin:6px 0 28px">À force de forger on devient forgeron.</p>
    <div style="width:100%;max-width:300px">
      <input id="ident" placeholder="Identifiant (PC26-A-07)" autocapitalize="characters" autocorrect="off" spellcheck="false" style="width:100%;margin-bottom:12px">
      <input id="pin" placeholder="Code à 6 chiffres" inputmode="numeric" type="password" maxlength="6" style="width:100%;margin-bottom:12px;letter-spacing:.3em">
      <div id="err" class="err-txt" style="margin-bottom:8px">${esc(msg||'')}</div>
      <button class="btn btn-encre" id="go">Se connecter</button>
    </div></div>`;
  const go=async()=>{
    const id=document.getElementById('ident').value.trim().toUpperCase();
    const pin=document.getElementById('pin').value.trim();
    if(!id||pin.length<6){document.getElementById('err').textContent='Entre ton identifiant et ton code.';return;}
    document.getElementById('go').disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:id.toLowerCase()+EMAIL_DOMAIN,password:pin});
    if(error){document.getElementById('err').textContent='Identifiant ou code incorrect.';document.getElementById('go').disabled=false;return;}
    (await charger())?accueil():login('Compte non trouvé.');
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

// ═══════════ STATS ═══════════
function statsChapitre(chid){
  const nts=S.notions.filter(n=>n.chapter_id===chid);
  let f=0,e=0,a=0;
  nts.forEach(n=>{const b=S.srs[n.notion_id]?.box??0;if(b<=1)f++;else if(b<=3)e++;else a++;});
  const p=S.progression[chid];
  const niv=p?.niveau_qcm??0;
  const cartesTot=p?.cartes_total??0,cartesMait=p?.cartes_maitrisees??0;
  const pctCartes=cartesTot>0?Math.round(100*cartesMait/cartesTot):(nts.length?Math.round(100*a/nts.length):0);
  const pctQcm=niv===3?100:niv===2?80:niv===1?50:p?.questions_niv1_tot>0?25:0;
  return {fragile:f,encours:e,acquise:a,niveau:niv,pctCartes,pctQcm};
}
function statsGlobal(){
  let totF=0,totC=0;const parChap={};
  S.chapActifs.forEach(ch=>{const s=statsChapitre(ch);parChap[ch]=s;totF+=s.pctCartes;totC+=s.pctQcm;});
  return {parChap,moyF:S.chapActifs.length?Math.round(totF/S.chapActifs.length):0,moyC:S.chapActifs.length?Math.round(totC/S.chapActifs.length):0};
}

// ═══════════ ACCUEIL ═══════════
function accueil(){
  S.ongletActif='accueil';
  if(S.chapCourant === null || S.chapCourant === undefined){
    APP.innerHTML=`<div class="ecran-pad centre" style="padding-top:30vh"><p class="muted">Aucun chapitre n'est encore ouvert par ton professeur.</p><button class="btn btn-blanc" style="margin-top:20px;width:200px;margin-left:auto;margin-right:auto" onclick="(async()=>{await sb.auth.signOut();location.reload();})()">Se déconnecter</button></div>`;
    return;
  }
  const ch=S.chapitres.find(c=>c.id===S.chapCourant);
  const st=statsChapitre(S.chapCourant);

  APP.innerHTML=`
  <div class="scroll">
    <div class="hero">
      <svg class="hero-deco" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="100" cy="60" r="8"/><circle cx="150" cy="100" r="6"/><circle cx="60" cy="120" r="7"/><path d="M100 68v40M108 64l38 32M92 66 64 114"/></svg>
      <div class="avatar" id="goProfil">${ICN.user.replace('width="22"','').replace('height="22"','')}</div>
      <h1 class="display">Bonjour !</h1>
      <div class="sub">À force de forger on devient forgeron</div>
    </div>

    <div class="chap-select" id="openChap">
      <div class="ic">⚗️</div>
      <div style="flex:1;min-width:0">
        <div class="lab">Chapitre travaillé</div>
        <div class="val" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ch?.nom||'—')}</div>
      </div>
      <div style="font-size:20px">⌄</div>
    </div>

    <!-- ESPACE FLASHCARDS -->
    <div class="zone">
      <div class="zone-head">
        <div class="zone-ic" style="background:var(--primaireC)">📘</div>
        <div class="zone-titre">ESPACE FLASHCARDS</div>
      </div>
      <div class="zone-sub">Mémorise les notions clés du chapitre.</div>
      <button class="btn btn-plein" id="fcTout">🚀 Faire tout le chapitre</button>
      <button class="btn btn-ligne" id="fcDiff">🎯 Revoir mes cartes difficiles</button>
    </div>

    <!-- ESPACE QCM -->
    <div class="zone">
      <div class="zone-head">
        <div class="zone-ic" style="background:var(--accentC)">🎯</div>
        <div class="zone-titre">ESPACE QCM</div>
      </div>
      <div class="zone-sub">Entraîne-toi et valide les 3 niveaux du chapitre.</div>
      <button class="btn btn-accent" id="qcmProg">🏆 Progresser dans le chapitre</button>
      <button class="btn btn-ligne" id="qcmErr">🔄 Revoir mes erreurs</button>
    </div>

    <!-- PRÉPARER BAC -->
    <div class="bac-row" id="goBac">
      <div class="bac-ic">🎓</div>
      <div style="flex:1;font-weight:700;font-size:16px;color:var(--txt-primaire)">Préparer mon bac</div>
      <div style="font-size:20px;color:var(--gris)">›</div>
    </div>

    <!-- PROGRESSION RÉSUMÉ -->
    <div class="zone">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">📈</span><span style="font-weight:800;font-size:17px;color:var(--txt-primaire)">Ma progression</span></div>
        <button id="goProg" style="background:none;color:var(--accent);font-size:13px;font-weight:600">Détail par chapitre →</button>
      </div>
      <div class="prog-row">
        <div class="prog-lab">Flashcards</div>
        <div class="prog-bar"><div style="width:${st.pctCartes}%;background:linear-gradient(90deg,var(--primaire),var(--primaire2))"></div></div>
        <div class="prog-pct">${st.pctCartes}%</div>
      </div>
      <div style="display:flex;gap:14px;padding-left:92px;margin:-6px 0 14px">
        <span class="dot" style="color:var(--coral)">●<b>${st.fragile}</b><span class="muted" style="font-size:11px">à consolider</span></span>
        <span class="dot" style="color:var(--amber)">●<b>${st.encours}</b><span class="muted" style="font-size:11px">en cours</span></span>
        <span class="dot" style="color:var(--green)">●<b>${st.acquise}</b><span class="muted" style="font-size:11px">acquises</span></span>
      </div>
      <div class="prog-row">
        <div class="prog-lab">QCM</div>
        <div class="prog-bar"><div style="width:${st.pctQcm}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div class="prog-pct">${st.pctQcm}%</div>
      </div>

// ═══════════ SÉANCE (QCM ou CARTES) ═══════════
async function seance(mode,type,chaps,seulementDues){
  APP.innerHTML=`<div class="centre" style="padding-top:40vh"><span class="spin"></span><p class="muted petit" style="margin-top:10px">Préparation…</p></div>`;
  S.mode=mode;S.resQcm=[];S.resCartes=[];S.seanceChaps=chaps;
  if(chaps.length===1){try{await sb.rpc('maj_preferences',{p_chapitre:chaps[0]});}catch(e){}}

  const {data:items}=await sb.from('v_items_eleve').select('*').in('chapter_id',chaps).limit(3000);
  if(!items?.length){return finVide();}

  const dues=new Set(Object.entries(S.srs).filter(([,r])=>r.due_date<=today()).map(([k])=>k));
  const fragiles=new Set(Object.values(S.srs).filter(r=>r.box<=1).map(r=>r.notion_id));

  if(type==='qcm'){
    let qcms=items.filter(i=>i.type==='qcm');
    if(mode==='qcm_err'){ // revoir erreurs : notions où l'élève a raté, sans impact niveaux
      qcms=qcms.filter(i=>(i.notion_ids||[]).some(nid=>fragiles.has(nid)));
      if(!qcms.length)qcms=items.filter(i=>i.type==='qcm');
    } else if(mode==='qcm_prog'){ // progression : limiter au niveau débloqué+1
      const niv=S.progression[chaps[0]]?.niveau_qcm??0;
      const diffMax=niv===0?2:niv===1?3:3; // présente le niveau courant et le suivant
      qcms=qcms.filter(i=>i.difficulty<=diffMax);
    }
    const score=it=>{let s=1+Math.random();for(const nid of it.notion_ids||[]){if(dues.has(nid))s+=3;if(!S.srs[nid])s+=2;if(fragiles.has(nid))s+=2;}return s;};
    qcms=qcms.sort((a,b)=>score(b)-score(a));
    const taille=mode.startsWith('bac')?20:S.classe.session_size_qcm;
    S.fileQcm=melange(qcms.slice(0,taille));S.fileCartes=[];
    if(!S.fileQcm.length)return finVide();
    qcmEcran(0);
  } else {
    let cartes=items.filter(i=>i.type==='flashcard');
    if(seulementDues){const d=cartes.filter(i=>(i.notion_ids||[]).some(nid=>dues.has(nid)||!S.srs[nid]));if(d.length)cartes=d;}
    const score=it=>{let s=1+Math.random();for(const nid of it.notion_ids||[]){if(dues.has(nid))s+=4;if(!S.srs[nid])s+=2;}return s;};
    cartes=cartes.sort((a,b)=>score(b)-score(a));
    const taille=mode==='fc_tout'?cartes.length:mode.startsWith('bac')?40:S.classe.session_size_cards;
    S.fileCartes=melange(cartes.slice(0,taille));S.fileQcm=[];
    if(!S.fileCartes.length)return finVide();
    ankiInit();
  }
}

    catch(e){res={correct:k===it.answer,bonne_reponse:it.answer};}

    if(impacteNiveau){try{await sb.rpc('maj_progression_qcm',{p_eleve_id:S.eleve.id,p_chapter_id:it.chapter_id,p_difficulty:it.difficulty,p_correct:!!res.correct});}catch(e){}}
    document.querySelectorAll('#opts .option').forEach(x=>{
      if(x.dataset.k===res.bonne_reponse)x.classList.add('bonne');
      if(x.dataset.k===k&&!res.correct&&k!=='NSP')x.classList.add('fausse');});
    document.getElementById('fb').innerHTML=res.correct
      ?`<div style="margin-top:12px;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--okC);color:var(--ok)">Exact, bien joué !</div>`
      :`<div style="margin-top:12px;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--errC);color:var(--err)">La bonne réponse était ${esc(res.bonne_reponse)}.</div>`;
    const fin=i+1>=S.fileQcm.length;
    document.getElementById('suite').innerHTML=`<button class="btn btn-encre" id="next">${fin?'Voir mon score':'Question suivante'}</button>`;
    document.getElementById('next').onclick=async()=>{
      if(fin){const {data:prog}=await sb.from('progression').select('*').eq('eleve_id',S.eleve.id);S.progression={};(prog||[]).forEach(p=>S.progression[p.chapter_id]=p);bilan();}
      else qcmEcran(i+1);};
  });
}

function ankiInit(){S.ankiFile=[...S.fileCartes];S.ankiRepasse=[];S.ankiIdx=0;ankiCarte();}

      `<div class="sticky-bas"><button class="btn btn-blanc" id="nsp">Je ne sais pas</button></div>`}
    </div>`;
    document.getElementById('home').onclick=accueil;maths();
    document.getElementById('flip').onclick=()=>{flip=!flip;r();};
    if(!flip)document.getElementById('nsp').onclick=()=>evalCarte(0);
    else{document.getElementById('bN').onclick=()=>evalCarte(0);document.getElementById('bM').onclick=()=>evalCarte(1);document.getElementById('bO').onclick=()=>evalCarte(2);}
  };r();
}
async function evalCarte(niv){
  const c=S.ankiFile[S.ankiIdx];const su=niv===2,partiel=niv===1;
  S.resCartes.push({item:c,su,partiel});
  if(niv===0)S.ankiRepasse.push(c);
  try{
    await sb.rpc('evaluer_carte',{p_item_id:c.id,p_su:niv===2,p_mode:S.mode.startsWith('bac')||S.mode==='fc_tout'?'libre':'jour'});
    if(partiel){await sb.from('srs_notions').upsert((c.notion_ids||[]).map(nid=>({eleve_id:S.eleve.id,notion_id:nid,box:2,due_date:new Date(Date.now()+3*86400000).toISOString().slice(0,10),streak:0,last_review:new Date().toISOString()})),{onConflict:'eleve_id,notion_id'});}
    await sb.rpc('maj_progression_cartes',{p_eleve_id:S.eleve.id,p_chapter_id:c.chapter_id});
  }catch(e){}
  S.ankiIdx++;ankiCarte();
}

async function bilan(){
  const nQ=S.resQcm.length,bons=S.resQcm.filter(r=>r.correct).length;
  const nC=S.resCartes.length,sus=S.resCartes.filter(r=>r.su).length,nonSus=S.resCartes.filter(r=>!r.su&&!r.partiel).length;
  try{await sb.rpc('enregistrer_seance',{p_type:S.mode.startsWith('bac')?'libre':'libre',p_n_items:nQ+nC,p_n_correct:bons+sus});}catch(e){}
  const [{data:prog},{data:srs}]=await Promise.all([
    sb.from('progression').select('*').eq('eleve_id',S.eleve.id),
    sb.from('srs_notions').select('*').eq('eleve_id',S.eleve.id)]);
  S.progression={};(prog||[]).forEach(p=>S.progression[p.chapter_id]=p);

  const score=nQ>0?`${bons}/${nQ}`:nC>0?`${sus}/${nC}`:'—';

  APP.innerHTML=`<div class="scroll ecran-pad">

    <div class="centre" style="margin:12px 0 20px">

      <div class="display" style="font-size:54px;margin-top:6px;color:var(--txt-primaire)">${score}</div>
      <div class="muted">${sous}</div>
      ${nonSus>0?`<div style="margin-top:8px;font-size:13px;color:var(--coral)">🔁 ${nonSus} carte${nonSus>1?'s':''} repassée${nonSus>1?'s':''}</div>`:''}
    </div>
    ${badgesNew.length?`<div class="zone" style="background:var(--greenC);border:1px solid var(--green2)">
      <div style="font-weight:800;color:var(--green);margin-bottom:8px">🎉 Niveau débloqué !</div>
      ${badgesNew.map(p=>`<div style="color:var(--green)">Ch.${p.chapter_id} → ${NIVEAUX[p.niveau_qcm].l}</div>`).join('')}</div>`:''}
    <button class="btn btn-accent" id="encore" style="margin-bottom:10px">Continuer</button>
    <button class="btn btn-blanc" id="retour">Retour à l'accueil</button>
  </div>${navBas('accueil')}`;

    if(S.mode.startsWith('bac'))ecranBac();

  };
  brancherNav();maths();
}

function ongletProfil(){
  S.ongletActif='profil';
  const THEMES=[['ocean','Bleu Océan','#1B4FA8'],['emeraude','Émeraude','#0F6E56'],['violet','Violet Nuit','#4A3A9E']];
  APP.innerHTML=`<div class="scroll">
    <div class="hero" style="padding-bottom:28px"><h1 class="display" style="font-size:28px">Profil</h1>
      <div class="sub">${esc(S.classe.nom)} · ${esc(S.eleve.identifiant)}</div></div>
    <div class="zone" style="margin-top:-16px">
      <div style="font-weight:800;font-size:16px;color:var(--txt-primaire);margin-bottom:14px">🎨 Thème de couleur</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${THEMES.map(([k,nom,col])=>`<button class="check-row ${S.theme===k?'coche':''}" data-th="${k}" style="border:none;width:100%;text-align:left">
          <div style="width:28px;height:28px;border-radius:8px;background:${col};flex-shrink:0"></div>
          <div style="flex:1;font-weight:600;font-size:15px">${nom}</div>
          ${S.theme===k?'<span style="color:var(--primaire);font-size:20px">✓</span>':''}
        </button>`).join('')}
      </div>
    </div>
    <div class="zone">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">Identifiant</div><div class="muted petit">${esc(S.eleve.identifiant)}</div></div>
      </div>
    </div>
    <div style="margin:14px 16px">
      <button class="btn btn-blanc" id="deco" style="color:var(--err)">Se déconnecter</button>
    </div>
    <div style="height:8px"></div>
  </div>${navBas('profil')}`;
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=async()=>{
    S.theme=b.dataset.th;document.documentElement.setAttribute('data-theme',S.theme);
    try{await sb.rpc('maj_preferences',{p_theme:S.theme});}catch(e){}
    ongletProfil();
  });
  document.getElementById('deco').onclick=async()=>{await sb.auth.signOut();login();};
  brancherNav();
}

// ═══════════ NAV BAS ═══════════
function navBas(actif){
  return `<div class="navbas">
    <button data-nav="accueil" class="${actif==='accueil'?'actif':''}">${ICN.home}<span>Accueil</span></button>
    <button data-nav="progression" class="${actif==='progression'?'actif':''}">${ICN.chart}<span>Progression</span></button>
    <button data-nav="profil" class="${actif==='profil'?'actif':''}">${ICN.user}<span>Profil</span></button>
  </div>`;
}
function brancherNav(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.nav;
    if(n==='accueil')accueil();else if(n==='progression')ongletProgression();else ongletProfil();
  });
}

window.accueil=accueil;
init();
</script>
</body>
</html>
