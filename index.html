<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions Spé PC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap');
  :root{--encre:#1C2433;--papier:#F5F3EE;--blanc:#fff;--ligne:#E4E0D6;--accent:#1F6F8B;
    --accentC:#E5EFF2;--ok:#2E8B57;--okC:#E4F3EA;--err:#C0392B;--errC:#FAE8E5;--gris:#8A8578;}
  *{box-sizing:border-box;font-family:'Public Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--papier);color:var(--encre)}
  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .display{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
  .ecran{padding:24px 20px;flex:1;display:flex;flex-direction:column}
  .carte{background:var(--blanc);border:1px solid var(--ligne);border-radius:18px;padding:20px}
  .carte-sombre{background:var(--encre);color:#fff;border-radius:18px;padding:20px}
  button{cursor:pointer;border:none;font-size:16px}
  .btn{display:block;width:100%;min-height:52px;border-radius:999px;font-weight:600;
    transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-encre{background:var(--encre);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-blanc{background:var(--blanc);color:var(--encre);border:1px solid var(--ligne)}
  .btn:disabled{opacity:.3}
  input,select{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--ligne);
    background:var(--blanc);color:var(--encre);padding:0 16px;font-size:16px;outline:none}
  .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gris)}
  .pilule{display:inline-flex;align-items:center;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:999px;background:var(--accentC);color:var(--accent)}
  .option{display:block;width:100%;text-align:left;background:var(--blanc);
    border:1px solid var(--ligne);border-radius:14px;padding:14px 16px;min-height:52px;
    font-size:16px;color:var(--encre);margin-top:10px;transition:transform .1s}
  .option:active{transform:scale(.98)}
  .option.bonne{background:var(--okC);border-color:var(--ok)}
  .option.fausse{background:var(--errC);border-color:var(--err)}
  .option:disabled{cursor:default}
  .jauge{display:inline-flex;gap:4px;align-items:center}
  .jauge span{width:16px;height:6px;border-radius:99px;background:#DDD8CC}
  .progress{height:8px;border-radius:99px;background:var(--ligne);overflow:hidden;flex:1}
  .progress>div{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
  .home-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--ligne);
    background:var(--blanc);color:var(--encre);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ligne-notion{padding:14px 20px;border-bottom:1px solid var(--ligne);background:var(--blanc);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .chip{flex-shrink:0;border-radius:16px;border:1px solid var(--ligne);background:var(--blanc);
    color:var(--gris);padding:10px 14px;font-size:14px;font-weight:600;display:flex;
    flex-direction:column;align-items:flex-start;gap:6px}
  .chip.actif{border:2px solid var(--encre);color:var(--encre)}
  .feedback{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:500}
  .sticky-bas{position:sticky;bottom:0;margin-top:auto;padding:16px 0 8px;
    background:linear-gradient(transparent,var(--papier) 30%)}
  .erreur{color:var(--err);font-size:14px;margin-top:8px}
  .centre{text-align:center}
  .muted{color:var(--gris)}
  .petit{font-size:12px}
  .flip-carte{flex:1;min-height:260px;border-radius:18px;border:1px solid var(--ligne);
    background:var(--blanc);padding:24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;width:100%}
  .flip-carte.verso{background:var(--encre);color:#fff}
  .grille3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--ligne);
    border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .katex{font-size:1.05em}
</style>
</head>
<body>
<div class="app"><div id="ecran" class="ecran"><div class="centre" style="padding-top:40vh"><span class="spin"></span></div></div></div>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d; };
const E = document.getElementById('ecran');
const esc = (s) => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Les cartes H5P contiennent du HTML simple (strong/em/br/sub/sup) qu'on préserve
const htmlCarte = (s) => (s ?? '').replace(/<(?!\/?(strong|em|b|i|br|sub|sup)\b)[^>]*>/gi, '');
const melange = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const NIVEAUX = {
  nouvelle: { label: 'Nouvelle', dots: 0, color: '#C9C4B8' },
  fragile:  { label: 'À consolider', dots: 1, color: '#E2574C' },
  encours:  { label: 'En cours', dots: 2, color: '#E8B72E' },
  acquise:  { label: 'Acquise', dots: 3, color: '#3C9A6E' },
};
const boxToNiveau = (box) => box == null ? 'nouvelle' : box <= 1 ? 'fragile' : box <= 3 ? 'encours' : 'acquise';
const jauge = (niv, w = 16) => { const n = NIVEAUX[niv];
  return `<span class="jauge">${[0,1,2].map(i =>
    `<span style="width:${w}px;${i < n.dots ? 'background:' + n.color : ''}"></span>`).join('')}</span>`; };
const maison = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>`;
const rendreMaths = () => { if (window.renderMathInElement) try { renderMathInElement(E, {
  delimiters: [{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true},{left:'$$',right:'$$',display:true}],
  throwOnError: false }); } catch(e){} };

// ---------- État global ----------
let S = { eleve: null, classe: null, chapitres: [], chapActifs: [], srs: {}, notions: [],
  jourFaite: false, mode: 'jour', typeLibre: 'qcm', chapLibre: 0,
  fileQcm: [], fileCartes: [], resQcm: [], resCartes: [] };

// ---------- Chargement initial ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return ecranLogin();
  await chargerContexte() ? ecranAccueil() : ecranLogin('Compte introuvable. Vérifie ton identifiant auprès de ton professeur.');
}

async function chargerContexte() {
  const { data: el } = await sb.from('eleves').select('*').maybeSingle();
  if (!el) { await sb.auth.signOut(); return false; }
  S.eleve = el;
  const [{ data: cl }, { data: cc }, { data: srs }, { data: nts }, { data: sj }] = await Promise.all([
    sb.from('classes').select('*').eq('id', el.classe_id).maybeSingle(),
    sb.from('classe_chapitres').select('*').eq('classe_id', el.classe_id).eq('active', true),
    sb.from('srs_notions').select('*'),
    sb.from('notions').select('*'),
    sb.from('seances').select('id').eq('type', 'jour').gte('started_at', new Date().toISOString().slice(0,10)),
  ]);
  S.classe = cl || { session_size_qcm: 15, session_size_cards: 10, nom: '' };
  S.chapActifs = (cc || []).map(c => c.chapter_id);
  S.srs = {}; (srs || []).forEach(r => S.srs[r.notion_id] = r);
  S.notions = (nts || []).filter(n => S.chapActifs.includes(n.chapter_id));
  S.jourFaite = (sj || []).length > 0;
  // titres de chapitres actifs
  const { data: chs } = await sb.from('v_items_eleve').select('chapter_id, chapter_title')
    .in('chapter_id', S.chapActifs.length ? S.chapActifs : [-1]).limit(2000);
  const seen = {};
  (chs || []).forEach(r => seen[r.chapter_id] = r.chapter_title);
  S.chapitres = Object.entries(seen).map(([id, nom]) => ({ id: +id, nom })).sort((a,b) => a.id - b.id);
  return true;
}

// ---------- Écrans ----------
function ecranLogin(message) {
  E.innerHTML = `
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--encre);display:flex;align-items:center;justify-content:center;margin-bottom:18px"><span style="color:#fff;font-size:24px">⌬</span></div>
    <h1 class="display" style="font-size:28px;margin:0">Révisions Spé PC</h1>
    <p class="muted" style="font-size:14px;margin:6px 0 28px">Quelques minutes par jour, au bon moment.</p>
    <div style="width:100%;max-width:300px">
      <div class="label">Identifiant</div>
      <input id="ident" placeholder="PC26-A-07" autocapitalize="characters" autocorrect="off" spellcheck="false" style="margin:4px 0 12px">
      <div class="label">Code</div>
      <input id="pin" placeholder="••••••" inputmode="numeric" type="password" maxlength="6" style="margin:4px 0 12px;letter-spacing:.3em">
      <div id="err" class="erreur">${esc(message || '')}</div>
      <button id="go" class="btn btn-encre" style="margin-top:8px">Se connecter</button>
    </div>
  </div>`;
  const go = async () => {
    const ident = document.getElementById('ident').value.trim().toUpperCase();
    const pin = document.getElementById('pin').value.trim();
    if (!ident || pin.length < 6) { document.getElementById('err').textContent = 'Entre ton identifiant et ton code à 6 chiffres.'; return; }
    document.getElementById('go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: ident.toLowerCase() + EMAIL_DOMAIN, password: pin });
    if (error) { document.getElementById('err').textContent = 'Identifiant ou code incorrect.'; document.getElementById('go').disabled = false; return; }
    (await chargerContexte()) ? ecranAccueil() : ecranLogin('Compte non rattaché à une classe — vois avec ton professeur.');
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function statsNiveaux() {
  const c = { nouvelle: 0, fragile: 0, encours: 0, acquise: 0 };
  S.notions.forEach(n => c[boxToNiveau(S.srs[n.notion_id]?.box)]++);
  return c;
}
function notionsDues() {
  const today = new Date().toISOString().slice(0, 10);
  return S.notions.filter(n => { const r = S.srs[n.notion_id]; return !r || r.due_date <= today; });
}

function ecranAccueil() {
  const c = statsNiveaux();
  const dues = notionsDues().length;
  E.innerHTML = `
  <div class="label">${esc(S.classe.nom)} · ${esc(S.eleve.identifiant)}</div>
  <h1 class="display" style="font-size:28px;margin:4px 0 16px">Bonjour !</h1>

  <div class="carte-sombre">
    <div style="font-size:14px;opacity:.8">Révision du jour</div>
    ${S.jourFaite
      ? `<div class="display" style="font-size:24px;margin-top:4px">Terminée ✓</div>
         <div class="petit" style="opacity:.7;margin-top:4px">Bien joué — rendez-vous demain pour la suivante.</div>`
      : `<div class="display" style="font-size:28px;margin-top:4px">${S.classe.session_size_qcm} questions <span style="opacity:.6;font-size:20px">+</span> ${S.classe.session_size_cards} cartes</div>
         <div class="petit" style="opacity:.7;margin-top:6px">${dues} notions à réviser aujourd'hui</div>
         <button id="btnJour" class="btn" style="background:#fff;color:var(--encre);margin-top:14px">▶&nbsp;&nbsp;Commencer</button>`}
  </div>

  <div class="carte" style="margin-top:14px">
    <div style="font-weight:700;font-size:14px">Révisions spéciales</div>
    <div class="muted petit" style="margin:4px 0 12px">Entraîne-toi autant que tu veux, sur ce que tu veux.</div>
    <div class="grille3" id="typeLibre" style="margin-bottom:12px">
      ${[['qcm','QCM'],['cartes','Cartes'],['mixte','Les deux']].map(([k, l]) =>
        `<button data-t="${k}" class="btn btn-blanc" style="min-height:44px;font-size:14px;${S.typeLibre===k?'background:var(--encre);color:#fff;border-color:var(--encre)':''}">${l}</button>`).join('')}
    </div>
    <button id="btnConso" class="btn btn-accent">Mes notions à consolider (${c.fragile})</button>
    <div style="display:flex;gap:8px;margin-top:10px">
      <select id="chapLibre" style="border-radius:999px;flex:1;min-width:0">
        <option value="0">Tous les chapitres</option>
        ${S.chapitres.map(ch => `<option value="${ch.id}" ${S.chapLibre===ch.id?'selected':''}>Chap. ${ch.id} — ${esc(ch.nom)}</option>`).join('')}
      </select>
      <button id="btnGo" class="btn btn-encre" style="width:auto;padding:0 22px;flex-shrink:0">Go</button>
    </div>
  </div>

  <div class="carte" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-weight:700;font-size:14px">Notions</span>
      <button id="btnTout" style="background:none;color:var(--accent);font-weight:600;font-size:14px">Tout voir →</button>
    </div>
    <div class="grille3">
      ${['fragile','encours','acquise'].map(k => `
        <button class="btn-niveau" data-n="${k}" style="background:var(--papier);border:1px solid var(--ligne);border-radius:14px;padding:12px 6px;text-align:center">
          <div class="display" style="font-size:24px">${c[k]}</div>
          ${jauge(k, 10)}
          <div class="petit muted" style="font-weight:500;margin-top:4px">${NIVEAUX[k].label}</div>
        </button>`).join('')}
    </div>
  </div>

  <p class="petit centre" style="color:#B0AB9E;margin-top:16px">
    Le contenu suit la progression du cours — ${S.chapitres.length} chapitre${S.chapitres.length>1?'s':''} ouvert${S.chapitres.length>1?'s':''} sur 27.
  </p>
  <button id="btnDeco" style="background:none;color:#B0AB9E;font-size:12px;margin-top:4px">Se déconnecter</button>`;

  if (!S.jourFaite) document.getElementById('btnJour').onclick = () => lancerSeance('jour', 'mixte', 0, false);
  document.querySelectorAll('#typeLibre button').forEach(b =>
    b.onclick = () => { S.typeLibre = b.dataset.t; ecranAccueil(); });
  document.getElementById('btnConso').onclick = () => lancerSeance('libre', S.typeLibre, 0, true);
  document.getElementById('btnGo').onclick = () => {
    S.chapLibre = +document.getElementById('chapLibre').value;
    lancerSeance('libre', S.typeLibre, S.chapLibre, false);
  };
  document.getElementById('btnTout').onclick = () => ecranNotions('tous');
  document.querySelectorAll('.btn-niveau').forEach(b => b.onclick = () => ecranNotions(b.dataset.n));
  document.getElementById('btnDeco').onclick = async () => { await sb.auth.signOut(); ecranLogin(); };
}

// ---------- Sélection des items et lancement de séance ----------
async function lancerSeance(mode, type, chapitre, seulementFragiles) {
  E.innerHTML = `<div class="centre" style="padding-top:40vh"><span class="spin"></span><p class="muted petit">Préparation de ta séance…</p></div>`;
  S.mode = mode; S.resQcm = []; S.resCartes = [];
  const today = new Date().toISOString().slice(0, 10);
  let chaps = chapitre ? [chapitre] : S.chapActifs;
  if (!chaps.length) { return finVide('Aucun chapitre n\'est encore ouvert par ton professeur.'); }

  let q = sb.from('v_items_eleve').select('*').in('chapter_id', chaps);
  const { data: items, error } = await q.limit(3000);
  if (error || !items) return finVide('Impossible de charger les questions — réessaie.');

  const fragiles = new Set(Object.values(S.srs).filter(r => r.box <= 1).map(r => r.notion_id));
  const duesSet = new Set(Object.entries(S.srs).filter(([, r]) => r.due_date <= today).map(([k]) => k));
  const score = (it) => {
    let s = 1 + Math.random();
    for (const nid of it.notion_ids || []) {
      if (seulementFragiles && fragiles.has(nid)) s += 10;
      if (duesSet.has(nid)) s += 4;
      if (!S.srs[nid]) s += 2; // notion jamais vue
    }
    return s;
  };
  let pool = items;
  if (seulementFragiles) {
    const f = items.filter(it => (it.notion_ids || []).some(nid => fragiles.has(nid)));
    if (f.length) pool = f;
  }
  const qcms = pool.filter(i => i.type === 'qcm').sort((a, b) => score(b) - score(a));
  const cartes = pool.filter(i => i.type === 'flashcard').sort((a, b) => score(b) - score(a));

  S.fileQcm = (type === 'cartes') ? [] : melange(qcms.slice(0, S.classe.session_size_qcm));
  S.fileCartes = (type === 'qcm') ? [] : melange(cartes.slice(0, S.classe.session_size_cards));

  if (!S.fileQcm.length && !S.fileCartes.length)
    return finVide(type === 'cartes' ? 'Pas encore de cartes disponibles sur cette sélection.' : 'Aucune question disponible sur cette sélection.');
  if (S.fileQcm.length) ecranQcm(0); else ecranCartes(0);
}

function finVide(msg) {
  E.innerHTML = `<div style="display:flex;justify-content:flex-end">${btnMaison()}</div>
  <div class="centre" style="margin-top:30vh"><p class="muted">${esc(msg)}</p>
  <button class="btn btn-encre" style="margin-top:16px" onclick="ecranAccueil()">Retour à l'accueil</button></div>`;
  brancherMaison();
}
const btnMaison = () => `<button class="home-btn" data-home>${maison}</button>`;
const brancherMaison = () => document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => ecranAccueil());

// ---------- Séance QCM ----------
function ecranQcm(i) {
  const it = S.fileQcm[i];
  const opts = melange(it.options); // mélange de l'ordre à chaque affichage
  const diff = '●'.repeat(it.difficulty) + '○'.repeat(3 - it.difficulty);
  E.innerHTML = `
  <div style="display:flex;align-items:center;gap:12px">
    <div class="progress"><div style="width:${(i / S.fileQcm.length) * 100}%"></div></div>
    <span class="petit" style="font-weight:600">${i}/${S.fileQcm.length}</span>
    ${btnMaison()}
  </div>
  <div style="margin:16px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="pilule">${esc(it.chapter_title)}</span>
    <span class="petit muted">${diff}</span>
  </div>
  <h2 style="font-size:18px;font-weight:600;line-height:1.4;margin:0">${htmlCarte(esc(it.stem))}</h2>
  <div id="opts">
    ${opts.map(o => `<button class="option" data-k="${o.key}"><b style="margin-right:8px">${o.key}.</b>${htmlCarte(esc(o.text))}</button>`).join('')}
    <button class="option" data-k="NSP" style="color:var(--gris)">Je ne sais pas</button>
  </div>
  <div id="fb"></div>
  <div class="sticky-bas" id="suite"></div>`;
  brancherMaison(); rendreMaths();

  document.querySelectorAll('#opts .option').forEach(b => b.onclick = async () => {
    document.querySelectorAll('#opts .option').forEach(x => x.disabled = true);
    const k = b.dataset.k;
    const t0 = Date.now();
    let res;
    try {
      const { data, error } = await sb.rpc('repondre',
        { p_item_id: it.id, p_response_key: k, p_duration_ms: Date.now() - t0, p_mode: S.mode });
      if (error) throw error; res = data;
    } catch (e) { res = { correct: k === '?', bonne_reponse: '?' }; }
    S.resQcm.push({ item: it, correct: !!res.correct });
    document.querySelectorAll('#opts .option').forEach(x => {
      if (x.dataset.k === res.bonne_reponse) x.classList.add('bonne');
      if (x.dataset.k === k && !res.correct && k !== 'NSP') x.classList.add('fausse');
    });
    document.getElementById('fb').innerHTML = res.correct
      ? `<div class="feedback" style="background:var(--okC);color:var(--ok)">Exact, bien joué !</div>`
      : `<div class="feedback" style="background:var(--errC);color:var(--err)">La bonne réponse était ${esc(res.bonne_reponse)}.</div>`;
    const fin = i + 1 >= S.fileQcm.length;
    document.getElementById('suite').innerHTML =
      `<button class="btn btn-encre" id="next">${fin ? (S.fileCartes.length ? 'Passer aux cartes' : 'Voir mon score') : 'Question suivante'}</button>`;
    document.getElementById('next').onclick = () => fin ? (S.fileCartes.length ? ecranCartes(0) : ecranBilan()) : ecranQcm(i + 1);
  });
}

// ---------- Séance cartes ----------
function ecranCartes(i) {
  const c = S.fileCartes[i];
  let flipped = false;
  const render = () => {
    E.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      <div class="progress"><div style="width:${(i / S.fileCartes.length) * 100}%"></div></div>
      <span class="petit" style="font-weight:600">${i}/${S.fileCartes.length}</span>
      ${btnMaison()}
    </div>
    <div class="label" style="margin:16px 0 8px">Carte ${i + 1}/${S.fileCartes.length} · réponds de tête, puis retourne</div>
    <button id="flip" class="flip-carte ${flipped ? 'verso' : ''}">
      <span class="label" style="color:${flipped ? '#A7B4C4' : 'var(--gris)'};margin-bottom:10px">${flipped ? 'Réponse' : 'Question'}</span>
      ${c.image_url && ((!flipped && c.image_position !== 'answer') || (flipped && c.image_position === 'answer'))
        ? '<img src="' + c.image_url + '" alt="illustration" style="max-width:100%;max-height:180px;border-radius:10px;margin-bottom:10px;object-fit:contain">'
        : ''}
      <div style="font-size:18px;font-weight:500;line-height:1.45">${htmlCarte(flipped ? c.answer : c.stem)}</div>
      ${flipped ? '' : '<span class="petit" style="color:#B0AB9E;margin-top:14px">Touche pour retourner</span>'}
    </button>
    ${flipped ? `
    <div style="margin-top:14px">
      <div class="label" style="margin-bottom:8px">Honnêtement, tu le savais ?</div>
      <div class="grille3">
        <button class="btn" data-su="0" style="background:var(--errC);color:var(--err)">Non</button>
        <button class="btn" data-su="0.5" style="background:#FBF1DC;color:#A8761B">À moitié</button>
        <button class="btn" data-su="1" style="background:var(--okC);color:var(--ok)">Oui</button>
      </div>
    </div>` : ''}`;
    brancherMaison(); rendreMaths();
    document.getElementById('flip').onclick = () => { flipped = !flipped; render(); };
    document.querySelectorAll('[data-su]').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      const su = b.dataset.su === '1';
      S.resCartes.push({ item: c, su });
      try { await sb.rpc('evaluer_carte', { p_item_id: c.id, p_su: su, p_mode: S.mode }); } catch (err) {}
      (i + 1 < S.fileCartes.length) ? ecranCartes(i + 1) : ecranBilan();
    });
  };
  render();
}

// ---------- Bilan ----------
async function ecranBilan() {
  const nQ = S.resQcm.length, bonnes = S.resQcm.filter(r => r.correct).length;
  const nC = S.resCartes.length, sues = S.resCartes.filter(r => r.su).length;
  try { await sb.rpc('enregistrer_seance', { p_type: S.mode, p_n_items: nQ + nC, p_n_correct: bonnes + sues }); } catch (e) {}
  // mouvements par notion
  const byNotion = {};
  const nomNotion = (nid) => (S.notions.find(n => n.notion_id === nid) || { nom: nid }).nom;
  S.resQcm.forEach(r => (r.item.notion_ids || []).forEach(nid => {
    byNotion[nid] = byNotion[nid] || { ok: 0, tot: 0 }; byNotion[nid].tot++; if (r.correct) byNotion[nid].ok++; }));
  S.resCartes.forEach(r => (r.item.notion_ids || []).forEach(nid => {
    byNotion[nid] = byNotion[nid] || { ok: 0, tot: 0 }; byNotion[nid].tot++; if (r.su) byNotion[nid].ok++; }));
  const mouvements = Object.entries(byNotion).map(([nid, s]) => ({
    nom: nomNotion(nid), reussi: s.ok / s.tot >= 0.8,
    acquise: boxToNiveau((S.srs[nid]?.box ?? 0) + 1) === 'acquise' }));

  const score = nQ > 0 ? `${bonnes}/${nQ}` : `${sues}/${nC}`;
  const sousScore = nQ > 0 ? `questions justes${nC ? ` · ${sues}/${nC} cartes sues` : ''}` : 'cartes sues';
  E.innerHTML = `
  <div style="display:flex;justify-content:flex-end">${btnMaison()}</div>
  <div class="centre" style="margin-top:8px">
    <div class="label">${S.mode === 'libre' ? 'Révision spéciale' : 'Révision du jour'}</div>
    <div class="display" style="font-size:48px;margin-top:4px">${score}</div>
    <div class="muted" style="font-size:14px">${sousScore}</div>
  </div>
  <div class="carte" style="margin-top:20px">
    <div style="font-weight:700;font-size:14px;margin-bottom:14px">Tes notions ont bougé</div>
    ${mouvements.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px">
        <span style="font-size:14px;font-weight:500">${esc(m.nom)}</span>
        <span class="petit" style="font-weight:600;color:${m.reussi ? 'var(--ok)' : 'var(--err)'};flex-shrink:0">
          ${m.reussi ? (m.acquise ? 'Acquise ✓' : 'Progresse ↑') : 'À retravailler'}</span>
      </div>`).join('')}
  </div>
  ${S.mode === 'libre' ? `<button class="btn btn-accent" id="encore" style="margin-top:16px">Encore une série</button>` : ''}
  <button class="btn ${S.mode === 'libre' ? 'btn-blanc' : 'btn-encre'}" id="retour" style="margin-top:10px">Retour à l'accueil</button>`;
  brancherMaison();
  if (S.mode === 'libre') document.getElementById('encore').onclick = () =>
    lancerSeance('libre', S.typeLibre, S.chapLibre, false);
  document.getElementById('retour').onclick = async () => {
    if (S.mode === 'jour') S.jourFaite = true;
    const { data: srs } = await sb.from('srs_notions').select('*');
    S.srs = {}; (srs || []).forEach(r => S.srs[r.notion_id] = r);
    ecranAccueil();
  };
}

// ---------- Écran Notions ----------
function ecranNotions(filtreInitial) {
  let niveau = filtreInitial || 'tous', chap = 0;
  const FILTRES = [['tous','Toutes'],['fragile','À consolider'],['encours','En cours'],['acquise','Acquises']];
  const render = () => {
    const visibles = S.notions
      .map(n => ({ ...n, niveau: boxToNiveau(S.srs[n.notion_id]?.box) }))
      .filter(n => (niveau === 'tous' || n.niveau === niveau) && (chap === 0 || n.chapter_id === chap))
      .sort((a, b) => a.chapter_id - b.chapter_id || a.nom.localeCompare(b.nom));
    const dansChap = S.notions.filter(n => chap === 0 || n.chapter_id === chap);
    const acquises = dansChap.filter(n => boxToNiveau(S.srs[n.notion_id]?.box) === 'acquise').length;
    E.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <h1 class="display" style="font-size:28px;margin:0">Notions</h1>${btnMaison()}
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:0 20px 4px">
      ${FILTRES.map(([k, l]) => `
        <button class="chip ${niveau === k ? 'actif' : ''}" data-f="${k}">${l}
          ${k === 'tous'
            ? `<span class="jauge">${['fragile','encours','acquise'].map(x => `<span style="width:12px;background:${NIVEAUX[x].color}"></span>`).join('')}</span>`
            : jauge(k, 12)}
        </button>`).join('')}
    </div>
    <select id="selChap" style="margin-top:12px">
      <option value="0">Tous les chapitres</option>
      ${S.chapitres.map(c => `<option value="${c.id}" ${chap === c.id ? 'selected' : ''}>Chap. ${c.id} — ${esc(c.nom)}</option>`).join('')}
    </select>
    <div style="margin:16px -20px 0;padding:14px 20px;background:#EDEAE2;display:flex;justify-content:space-between;align-items:baseline">
      <div><span class="display" style="font-size:22px">${visibles.length}</span>
        <span class="muted" style="font-size:14px;margin-left:6px">notion${visibles.length > 1 ? 's' : ''}</span></div>
      <span class="petit muted" style="font-weight:500">${acquises}/${dansChap.length} acquises</span>
    </div>
    <div style="margin:0 -20px">
      ${visibles.map(n => `
        <div class="ligne-notion">
          <div style="min-width:0">
            <div style="font-weight:600;font-size:15px;line-height:1.3">${esc(n.nom)}</div>
            <div class="petit muted" style="margin:2px 0 6px">Chap. ${n.chapter_id} — ${esc((S.chapitres.find(c => c.id === n.chapter_id) || {}).nom || '')}</div>
            ${jauge(n.niveau)}
          </div>
          <span class="petit" style="font-weight:600;flex-shrink:0;padding:4px 10px;border-radius:999px;
            background:${NIVEAUX[n.niveau].color}22;color:${NIVEAUX[n.niveau].color}">${NIVEAUX[n.niveau].label}</span>
        </div>`).join('')}
      ${visibles.length === 0 ? `<div class="centre muted" style="padding:40px 20px;font-size:14px">Aucune notion ici pour l'instant — continue tes séances !</div>` : ''}
    </div>`;
    brancherMaison();
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { niveau = b.dataset.f; render(); });
    document.getElementById('selChap').onchange = (e) => { chap = +e.target.value; render(); };
  };
  render();
}

window.ecranAccueil = ecranAccueil;
init();
</script>
</body>
</html>
